<title>CuttingBoard Tasks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: one pixel-art panel stack like Aseprite's dark UI — task input on top, then a single prioritized list. Dark only, by design. */
:root {
  --checker-a: #23252c;
  --checker-b: #1e2026;
  --panel: #2f323b;
  --panel-hi: #474b57;
  --panel-lo: #17181d;
  --row: #383c47;
  --row-hover: #414553;
  --ink: #e8e6df;
  --dim: #9a9cab;
  --accent: #29adff;     /* selection blue */
  --accent-ink: #0b1a26;
  --ok: #00e436;
  --warn: #ffa300;
  --bad: #ff4d6d;
  --work: #29adff;
  --idle: #8a8d9b;
  --px: "Silkscreen", "Courier New", monospace;
  --body: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--checker-b); }
body {
  color: var(--ink);
  font: 17px/1.4 var(--body);
  background-color: var(--checker-b);
  background-image:
    linear-gradient(45deg, var(--checker-a) 25%, transparent 25%, transparent 75%, var(--checker-a) 75%),
    linear-gradient(45deg, var(--checker-a) 25%, transparent 25%, transparent 75%, var(--checker-a) 75%);
  background-size: 32px 32px;
  background-position: 0 0, 16px 16px;
  padding-inline: 16px;
  padding-block: 24px 48px;
  min-height: 100%;
}
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 16px; }

/* Pixel panel: hard 2px bevel, notched corners, no blur anywhere. */
.panel {
  background: var(--panel);
  box-shadow: inset 2px 2px 0 var(--panel-hi), inset -2px -2px 0 var(--panel-lo), 0 0 0 2px var(--panel-lo);
  clip-path: polygon(0 4px, 4px 4px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 4px), 0 calc(100% - 4px));
  padding: 14px;
}
.titlebar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
h1 { font: 700 22px/1 var(--px); margin: 0; letter-spacing: 1px; text-transform: uppercase; }
h1 b { color: var(--accent); }
.manager { font: 400 12px/1.3 var(--px); color: var(--dim); display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
.led { width: 8px; height: 8px; background: var(--idle); flex: none; box-shadow: 0 0 0 2px var(--panel-lo); }
.led.live { background: var(--ok); }
.led.stale { background: var(--warn); }
@media (prefers-reduced-motion: no-preference) { .led.live { animation: blink 1.6s steps(1) infinite; } }
@keyframes blink { 50% { background: #008a21; } }

form.add { display: flex; gap: 10px; align-items: stretch; margin-top: 12px; }
form.add label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.field {
  flex: 1; min-width: 0;
  font: 18px/1.35 var(--body); color: var(--ink);
  background: var(--panel-lo); border: 0; padding: 10px 12px; resize: none; overflow: hidden;
  box-shadow: inset 2px 2px 0 #0d0e11, inset -2px -2px 0 var(--panel-hi);
}
.field::placeholder { color: #6c6f7d; }
.field:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.hint { font: 11px/1.3 var(--px); color: var(--dim); margin: 8px 0 0; text-transform: uppercase; }

button {
  font: 700 13px/1 var(--px); text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--ink); background: var(--row); border: 0; padding: 10px 14px; cursor: pointer;
  box-shadow: inset 2px 2px 0 var(--panel-hi), inset -2px -2px 0 var(--panel-lo);
}
button:hover:not(:disabled) { background: var(--row-hover); }
button:active:not(:disabled) { box-shadow: inset 2px 2px 0 var(--panel-lo), inset -2px -2px 0 var(--panel-hi); transform: translateY(1px); }
button:focus-visible, .row-head:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); box-shadow: inset 2px 2px 0 #8fd6ff, inset -2px -2px 0 #1677b3; }
button.primary:hover:not(:disabled) { background: #4dbcff; }
button.go { background: var(--ok); color: #062b10; box-shadow: inset 2px 2px 0 #7dff9c, inset -2px -2px 0 #009424; }
button.go:hover:not(:disabled) { background: #3cf065; }
button:disabled { opacity: 0.5; cursor: default; }

.notice { font: 13px/1.4 var(--px); color: var(--warn); margin: 0; text-transform: uppercase; }
.err { color: var(--bad); font-size: 15px; margin: 6px 0 0; }

.list { display: grid; gap: 6px; }
.group { font: 700 12px/1 var(--px); color: var(--dim); text-transform: uppercase; letter-spacing: 1px; margin: 14px 2px 4px; display: flex; gap: 8px; align-items: center; }
.group:first-child { margin-top: 0; }
.group::after { content: ""; flex: 1; height: 2px; background: repeating-linear-gradient(90deg, var(--panel-hi) 0 4px, transparent 4px 8px); }
.group .n { color: var(--ink); }

.task { background: var(--row); box-shadow: inset 2px 2px 0 var(--panel-hi), inset -2px -2px 0 var(--panel-lo); }
.task.needs { box-shadow: inset 2px 2px 0 var(--panel-hi), inset -2px -2px 0 var(--panel-lo), -4px 0 0 var(--warn); margin-left: 4px; }
.row-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; cursor: pointer; }
.row-head:hover { background: var(--row-hover); }
.task-title { font-size: 17px; overflow-wrap: anywhere; }
.when { font: 11px/1 var(--px); color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }

.status { font: 700 11px/1 var(--px); text-transform: uppercase; padding: 5px 7px 5px 6px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; background: var(--panel-lo); color: var(--idle); min-width: 0; }
.status::before { content: ""; width: 6px; height: 6px; background: currentColor; flex: none; }
.status.queued { color: var(--idle); }
.status.working { color: var(--work); }
.status.review { color: var(--warn); }
.status.attention { color: var(--bad); }
.status.done { color: var(--ok); }
@media (prefers-reduced-motion: no-preference) { .status.working::before { animation: pulse 0.8s steps(2) infinite; } }
@keyframes pulse { 50% { opacity: 0.25; } }
@media (max-width: 560px) {
  .row-head { grid-template-columns: minmax(0, 1fr) auto; }
  .row-head .status { grid-column: 1 / -1; justify-self: start; }
}

.body { padding: 0 12px 12px; display: grid; gap: 10px; }
.block { display: grid; gap: 4px; }
.label { font: 700 10px/1 var(--px); color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
.text { margin: 0; font-size: 15.5px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
.text.muted { color: var(--dim); }
.note { margin: 0; font-size: 15px; color: var(--bad); background: var(--panel-lo); padding: 8px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.report { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.report a { font: 700 13px/1 var(--px); color: var(--accent); text-transform: uppercase; }
.path { font: 11px/1.4 var(--px); color: var(--dim); overflow-wrap: anywhere; text-transform: none; }
.meta { font: 11px/1.6 var(--px); color: var(--dim); overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.changes { display: grid; gap: 8px; }
.changes textarea { min-height: 70px; overflow: auto; resize: vertical; }

.empty { text-align: center; padding: 28px 12px; color: var(--dim); font-size: 16px; }
.empty b { display: block; font: 700 13px/1.4 var(--px); color: var(--ink); text-transform: uppercase; margin-bottom: 4px; }
details.done > summary { list-style: none; cursor: pointer; }
details.done > summary::-webkit-details-marker { display: none; }
details.done > summary .group::before { content: "▸"; color: var(--ink); }
details.done[open] > summary .group::before { content: "▾"; }
details.done .list { margin-top: 6px; }
</style>

<div class="wrap">
  <section class="panel">
    <div class="titlebar">
      <h1>Cutting<b>Board</b> Tasks</h1>
      <div class="manager"><span class="led" id="led"></span><span id="managerText">Manager not checked in</span></div>
    </div>
    <form class="add" id="addForm">
      <label for="newTask">New task</label>
      <textarea class="field" id="newTask" rows="1" maxlength="2000" placeholder="Make bandits flee when they're below 20% health" required></textarea>
      <button class="primary" type="submit" id="addBtn">Add</button>
    </form>
    <p class="hint">Enter adds · Shift+Enter for a new line · Claude writes the agent's brief</p>
    <p class="err" id="addErr" hidden></p>
    <p class="notice" id="noDb" hidden>Storage isn't available in this view. Open the board on claude.ai while signed in.</p>
  </section>

  <section class="panel" aria-label="Tasks">
    <div id="list"></div>
  </section>
</div>

<script>
(function () {
  const STATUS = {
    todo:      ["Queued", "queued"],
    changes:   ["Queued · changes", "queued"],
    working:   ["Working", "working"],
    review:    ["Review", "review"],
    approved:  ["Merging", "working"],
    attention: ["Needs you", "attention"],
    done:      ["Merged", "done"],
  };
  const GROUPS = [
    ["Needs you", ["review", "attention"]],
    ["Running", ["working", "approved"]],
    ["Queue", ["changes", "todo"]],
  ];
  let db = null;
  let tasks = [];
  let loaded = false;
  const open = new Set();
  const changing = new Set();
  const busy = new Set();
  const drafts = {};
  const errors = {};
  let focusNext = null;

  const $ = (id) => document.getElementById(id);
  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function ago(ms) {
    if (!ms) return "";
    const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (s < 60) return "now";
    const m = Math.round(s / 60);
    if (m < 60) return m + "m ago";
    const h = Math.round(m / 60);
    if (h < 24) return h + "h ago";
    return new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function block(label, node) {
    const b = el("div", "block");
    b.append(el("span", "label", label), node);
    return b;
  }

  async function write(id, fn) {
    busy.add(id); delete errors[id]; render();
    try { await fn(); }
    catch (e) {
      try {
        if (!e || e.code !== "unavailable") throw e;
        await new Promise(r => setTimeout(r, 400 + Math.random() * 600));
        await fn();
      } catch (e2) {
        errors[id] = e2 && e2.code === "invalid_argument" ? "You can't change this board." : "That didn't save. Try again in a moment.";
      }
    }
    finally { busy.delete(id); render(); }
  }

  function taskRow(t) {
    const d = t.data;
    const needs = d.status === "review" || d.status === "attention";
    const isOpen = open.has(t.id) || needs || changing.has(t.id);
    const row = el("article", "task" + (needs ? " needs" : ""));

    const head = el("div", "row-head");
    head.tabIndex = 0;
    head.setAttribute("role", "button");
    head.setAttribute("aria-expanded", String(isOpen));
    const [label, cls] = STATUS[d.status] || [d.status, "queued"];
    head.append(
      el("span", "status " + cls, label + (d.round > 1 && d.status !== "done" ? " · R" + d.round : "")),
      el("span", "task-title", d.title || "Untitled task"),
      el("span", "when", ago(d.status === "done" ? d.mergedAt : d.updatedAt || d.createdAt))
    );
    const toggle = () => { open.has(t.id) ? open.delete(t.id) : open.add(t.id); render(); };
    if (!needs) {
      head.onclick = toggle;
      head.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
    }
    row.append(head);
    if (!isOpen) return row;

    const body = el("div", "body");
    if (d.note) body.append(el("p", "note", d.note));
    if (d.summary && d.status !== "todo") body.append(block("Result", el("p", "text", d.summary)));
    if (d.reportUrl || d.reportPath) {
      const r = el("div", "report");
      if (d.reportUrl) {
        const a = el("a", null, "▶ Open result page");
        a.href = d.reportUrl; a.target = "_blank"; a.rel = "noopener";
        r.append(a);
      }
      if (d.reportPath) r.append(el("span", "path", d.reportPath));
      body.append(r);
    }
    if (d.feedback && d.round > 1 && d.status !== "done") body.append(block("Your change request", el("p", "text", d.feedback)));
    if (d.answer && d.status !== "done") body.append(block("Your answer", el("p", "text", d.answer)));
    body.append(block("Agent brief", d.instructions
      ? el("p", "text", d.instructions)
      : el("p", "text muted", "Claude writes this when the task is picked up.")));

    const meta = [];
    meta.push("Added " + ago(d.createdAt));
    if (d.startedAt && d.status !== "todo") meta.push("started " + ago(d.startedAt));
    if (d.finishedAt && (d.status === "review" || d.status === "attention")) meta.push("finished " + ago(d.finishedAt));
    if (d.branch && d.status !== "done") meta.push(d.branch);
    if (d.mergeCommit) meta.push("merged as " + d.mergeCommit);
    body.append(el("div", "meta", meta.join(" · ")));

    const isBusy = busy.has(t.id) || !db;
    const actions = el("div", "actions");
    const ref = () => db.collection("tasks").doc(t.id);
    const question = d.status === "attention" && !d.branch;
    if (question) {
      const rp = el("button", "primary", changing.has(t.id) ? "Cancel" : "Reply");
      rp.type = "button"; rp.disabled = isBusy;
      rp.onclick = () => {
        if (changing.has(t.id)) changing.delete(t.id);
        else { changing.add(t.id); focusNext = t.id; }
        render();
      };
      const rm = el("button", null, "Remove");
      rm.type = "button"; rm.disabled = isBusy;
      rm.onclick = () => write(t.id, () => ref().delete());
      actions.append(rp, rm);
    } else if (needs) {
      const ap = el("button", "go", d.status === "attention" ? "Retry merge" : "Approve & merge");
      ap.type = "button"; ap.disabled = isBusy;
      ap.onclick = () => write(t.id, () => ref().update({ status: "approved", note: "", updatedAt: Date.now() }));
      const ch = el("button", null, changing.has(t.id) ? "Cancel" : "Request changes");
      ch.type = "button"; ch.disabled = isBusy;
      ch.onclick = () => {
        if (changing.has(t.id)) changing.delete(t.id);
        else { changing.add(t.id); focusNext = t.id; }
        render();
      };
      actions.append(ap, ch);
    }
    if (d.status === "todo") {
      const rm = el("button", null, "Remove");
      rm.type = "button"; rm.disabled = isBusy;
      rm.onclick = () => write(t.id, () => ref().delete());
      actions.append(rm);
    }
    if (actions.childElementCount) body.append(actions);

    if (changing.has(t.id) && needs) {
      const f = el("form", "changes");
      const tid = "fb-" + t.id;
      const lab = el("label", "label", question ? "Your answer" : "What should change?"); lab.htmlFor = tid;
      const ta = el("textarea", "field"); ta.id = tid; ta.required = true; ta.rows = 3;
      ta.placeholder = question ? "Answer the question above." : "They flee too early. Wait until 20% health, and drop their weapon.";
      ta.value = drafts[t.id] || "";
      ta.oninput = () => { drafts[t.id] = ta.value; };
      const send = el("button", "primary", "Back to queue"); send.type = "submit"; send.disabled = isBusy;
      f.append(lab, ta, send);
      f.onsubmit = (ev) => {
        ev.preventDefault();
        const text = ta.value.trim();
        if (!text) return;
        changing.delete(t.id); delete drafts[t.id];
        const next = question
          ? { status: "todo", answer: text, question: d.note || "", note: "", updatedAt: Date.now() }
          : { status: "changes", feedback: text, note: "", updatedAt: Date.now() };
        write(t.id, () => ref().update(next));
      };
      body.append(f);
      const wasFocused = document.activeElement && document.activeElement.id === tid;
      if (focusNext === t.id || wasFocused) { focusNext = null; setTimeout(() => { const n = $(tid); if (n) n.focus(); }, 0); }
    }
    if (errors[t.id]) body.append(el("p", "err", errors[t.id]));
    row.append(body);
    return row;
  }

  function render() {
    const box = $("list");
    const doneWasOpen = box.querySelector("details.done")?.open;
    box.replaceChildren();
    if (!tasks.length) {
      const e = el("div", "empty");
      e.append(el("b", null, loaded ? "No tasks yet" : "Loading tasks…"), document.createTextNode(loaded ? "Type one in the field above. The manager picks it up within about two minutes." : ""));
      box.append(e);
      return;
    }
    const sortKey = (t) => t.data.status === "changes" ? (t.data.updatedAt || 0) - 1e13 : (t.data.createdAt || 0);
    for (const [name, statuses] of GROUPS) {
      const list = tasks.filter(t => statuses.includes(t.data.status)).sort((a, b) => sortKey(a) - sortKey(b));
      if (!list.length) continue;
      const g = el("div", "group"); g.append(document.createTextNode(name + " "), el("span", "n", String(list.length)));
      const l = el("div", "list"); list.forEach(t => l.append(taskRow(t)));
      box.append(g, l);
    }
    const done = tasks.filter(t => t.data.status === "done").sort((a, b) => (b.data.mergedAt || 0) - (a.data.mergedAt || 0));
    if (done.length) {
      const det = el("details", "done");
      const sum = el("summary");
      const g = el("div", "group"); g.append(document.createTextNode("Done "), el("span", "n", String(done.length)));
      sum.append(g);
      const l = el("div", "list"); done.forEach(t => l.append(taskRow(t)));
      det.append(sum, l);
      if (doneWasOpen) det.open = true;
      box.append(det);
    }
    const known = new Set(Object.keys(STATUS));
    const other = tasks.filter(t => !known.has(t.data.status));
    if (other.length) {
      const g = el("div", "group", "Other");
      const l = el("div", "list"); other.forEach(t => l.append(taskRow(t)));
      box.append(g, l);
    }
  }

  let heartbeat = null;
  function renderManager() {
    const led = $("led"), txt = $("managerText");
    if (!heartbeat) { led.className = "led"; txt.textContent = "Manager not checked in"; return; }
    const stale = Date.now() - heartbeat.lastCheck > 6 * 60 * 1000;
    led.className = "led " + (stale ? "stale" : "live");
    txt.textContent = stale
      ? "Manager offline since " + ago(heartbeat.lastCheck)
      : "Manager online · " + (heartbeat.running || 0) + "/3 agents";
  }
  setInterval(() => { renderManager(); }, 30000);

  const field = $("newTask");
  const grow = () => { field.style.height = "auto"; field.style.height = field.scrollHeight + "px"; };
  field.addEventListener("input", grow);
  field.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("addForm").requestSubmit(); }
  });
  $("addForm").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if (!db) return;
    const title = field.value.trim();
    if (!title) return;
    $("addBtn").disabled = true; $("addErr").hidden = true;
    const now = Date.now();
    try {
      await db.collection("tasks").doc("t" + now.toString(36)).set({ title, status: "todo", createdAt: now, updatedAt: now, round: 1 });
      field.value = ""; grow();
    } catch (e) {
      $("addErr").textContent = e && e.code === "invalid_argument" ? "You can't add tasks to this board." : "The task didn't save. Try again in a moment.";
      $("addErr").hidden = false;
    } finally { $("addBtn").disabled = false; field.focus(); }
  });

  render();
  renderManager();

  (async () => {
    db = window.claude ? await window.claude.use("db") : null;
    if (!db) { $("noDb").hidden = false; $("addBtn").disabled = true; loaded = true; render(); return; }
    db.collection("tasks").onSnapshot(
      (snap) => { loaded = true; tasks = snap.docs.filter(d => d.exists).map(d => ({ id: d.id, data: d.data() })); render(); },
      () => { $("noDb").hidden = false; }
    );
    db.doc("meta/manager").onSnapshot(
      (snap) => { heartbeat = snap.exists ? snap.data() : null; renderManager(); },
      () => {}
    );
  })();
})();
</script>
